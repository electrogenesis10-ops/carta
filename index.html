<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génesis Electrodomésticos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #38bdf8;
            --accent-color: #2563eb;
            --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            text-align: center;
            scroll-behavior: smooth;
        }

        /* ================= HEADER ================= */
        header {
            height: 200px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        header img {
            max-height: 180px;
            max-width: 95%;
            object-fit: contain;
        }

        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            margin: 0;
            color: #fff;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .header-subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--primary-color);
            margin: 5px 0 0 0;
            letter-spacing: 6px;
            font-weight: 600;
        }

        /* ================= BANNER ================= */
        .banner {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
            padding: 12px 24px;
            border-radius: 12px;
            display: inline-block;
            margin: 24px auto 10px auto;
            font-weight: 600;
            font-size: 1.1rem;
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-sm);
        }

        /* ================= BUSCADOR ================= */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            max-width: 600px;
            padding: 0 15px;
        }

        .search-box input {
            padding: 12px 16px;
            width: 70%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--card-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .search-box button {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .search-box button:hover {
            background: #3b82f6;
            transform: translateY(-1px);
        }

        #btnVoice {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
        }

        #btnVoice:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ================= CATEGORÍAS ================= */
        #category-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            max-width: 1000px;
            padding: 0 15px;
        }

        #category-buttons button {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            padding: 8px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-sm);
        }

        #category-buttons button:hover {
            color: var(--text-color);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        #category-buttons button.active-cat {
            background: linear-gradient(135deg, var(--accent-color), #1d4ed8);
            color: #fff;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        /* ================= GRILLA DE PRODUCTOS ================= */
        #product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .item:hover {
            transform: translateY(-6px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: var(--shadow-md);
        }

        .item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: #151f32;
        }

        .item-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .item-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-color);
            line-height: 1.3;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 3.8em;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: auto;
        }

        /* ================= BOTON SUBIR ================= */
        #btnUp {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: none;
            cursor: pointer;
            z-index: 1000;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }

        #btnUp:hover {
            background: #3b82f6;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <header>
        <img src="img/french99.jpg" alt="logo">
    </header>

    <div class="banner" id="banner-text">¡Bienvenidos a Génesis Electrodomésticos!</div>

    <div class="search-box">
        <input id="search" type="text" placeholder="Buscar electrodoméstico o categoría...">
        <button id="btnSearch">Buscar</button>
        <button id="btnVoice" title="Buscar por voz">🎤</button>
    </div>

    <div id="category-buttons"></div>
    <div id="product-list"></div>
    <button id="btnUp">⬆️</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const USER = 'electrogenesis10-ops';
            const REPO = 'carta';

            const categoryContainer = document.getElementById('category-buttons');
            const productList = document.getElementById('product-list');
            const searchInput = document.getElementById('search');
            const btnSearch = document.getElementById('btnSearch');
            const btnVoice = document.getElementById('btnVoice');
            let productos = [];

            // --- PRODUCTOS Y CATEGORIAS ---
            async function load() {
                try {
                    const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/productos.json`, { cache: "no-store" });
                    if (!res.ok) throw new Error("No se pudo obtener el catálogo desde GitHub");
                    const data = await res.json();

                    productos = data.map(p => ({
                        id: p.id,
                        nombre: p.nombre || p.name || p.nome || 'Electrodoméstico',
                        descripcion: p.descripcion || p.description || p.descricao || '',
                        precio: p.precio || p.price || p.preco || '0',
                        imagen: p.imagen || p.image || p.imagem || 'https://via.placeholder.com/300x200?text=G%C3%A9nesis+Electro',
                        categoria: p.categoria || p.category || 'General'
                    }));

                    renderCategorias();
                    render(productos);
                } catch (e) {
                    console.error(e);
                    productList.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; padding: 40px;">No se pudo cargar el catálogo. Intente de nuevo más tarde.</p>`;
                }
            }

            function render(arr) {
                if (arr.length === 0) {
                    productList.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; padding: 40px;">No se encontraron resultados.</p>`;
                    return;
                }
                productList.innerHTML = arr.map(p => `
                    <div class="item">
                        <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/300x200?text=G%C3%A9nesis+Electro'">
                        <div class="item-info">
                            <div>
                                <h3 class="item-title">${p.nombre}</h3>
                                <p class="item-desc">${p.descripcion}</p>
                            </div>
                            <span class="price">${p.precio.toString().includes('$') ? p.precio : '$' + p.precio}</span>
                        </div>
                    </div>`).join('');
            }

            function renderCategorias() {
                const cats = ["Todos", ...new Set(productos.map(p => p.categoria).filter(Boolean))];
                categoryContainer.innerHTML = cats.map(cat => `
                    <button class="${cat === "Todos" ? 'active-cat' : ''}" onclick="filtrarCat('${cat}', this)">${cat}</button>
                `).join('');
            }

            window.filtrarCat = function (cat, btn) {
                document.querySelectorAll("#category-buttons button").forEach(b => b.classList.remove("active-cat"));
                btn.classList.add("active-cat");
                const filtrados = cat === "Todos" ? productos : productos.filter(p => p.categoria === cat);
                render(filtrados);
                window.scrollTo({ top: productList.offsetTop - 80, behavior: "smooth" });
            }

            // --- LÓGICA DE BÚSQUEDA ---
            function filtrar() {
                const q = searchInput.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const f = productos.filter(p => {
                    const nombre = (p.nombre || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const desc = (p.descripcion || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const cat = (p.categoria || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    return nombre.includes(q) || desc.includes(q) || cat.includes(q);
                });
                render(f);
            }

            searchInput.addEventListener('input', filtrar);
            btnSearch.onclick = () => {
                filtrar();
                window.scrollTo({ top: productList.offsetTop - 80, behavior: "smooth" });
            };
            searchInput.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    filtrar();
                    window.scrollTo({ top: productList.offsetTop - 80, behavior: "smooth" });
                }
            };

            // --- BÚSQUEDA POR VOZ ---
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'es-AR';
                recognition.onstart = () => { btnVoice.textContent = "🛑"; };
                recognition.onend = () => { btnVoice.textContent = "🎤"; };
                recognition.onresult = (event) => {
                    const voiceText = event.results[0][0].transcript;
                    searchInput.value = voiceText;
                    filtrar();
                    window.scrollTo({ top: productList.offsetTop - 80, behavior: "smooth" });
                };
                btnVoice.onclick = () => {
                    recognition.start();
                };
            } else {
                btnVoice.style.display = 'none';
            }

            // --- BOTON SUBIR ---
            window.onscroll = () => { document.getElementById('btnUp').style.display = window.scrollY > 300 ? "block" : "none"; };
            document.getElementById('btnUp').onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

            load();
        });
    </script>
</body>

</html>
